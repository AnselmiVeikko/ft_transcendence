services:
  game_fe:
    image: node:20-alpine
    container_name: game_fe
    working_dir: /game
    ports:
      - "5174:5174"
    volumes:
      - ./game/frontend:/game
      - /game/node_modules
    command: sh -c "npm install && npm run dev -- --host --port 5174"
    networks:
      - transcendence

  game_be:
    container_name: game_be
    build: 
      context: ./game/backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    depends_on:
      - backend
    networks:
      - transcendence

  frontend:
    image: node:24-alpine
    container_name: frontend
    working_dir: /frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - transcendence

  backend:
    container_name: transcendence_be
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "5555:5555"
    command: >
      sh -c "
        npx prisma migrate dev --name init &&
        npx prisma generate &&
        npm run dev
      "
    networks:
      - transcendence

networks:
  transcendence:
    name: transcendence
    driver: bridge
